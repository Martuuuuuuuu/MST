<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Cooperadora EEST N°1</title>
    <link rel="stylesheet" href="../styles/inicio.css">
    <link rel="stylesheet" href="../styles/sesion.css">
    <link rel="stylesheet" href="../styles/perfil.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="inicio.html">
            <img class="brand-logo" src="../img/logos/cooperadora.png" alt="Logo de la cooperadora">
            <span class="brand-text">Cooperadora <small>Escuela Técnica N°1 Eduardo Ader</small></span>
        </a>
        <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="main-nav" id="main-navigation" aria-label="Navegacion principal">
            <a href="inicio.html">Inicio</a>
            <a href="tienda.html">Productos</a>
            <a class="current" href="formulario.html">Iniciar sesión</a>
            <a href="registro.html">Registrarse</a>
        </nav>
    </header>

    <main class="sesion-main">
        <div class="sesion-card">
            <h1>Iniciar sesión</h1>
            <p class="sesion-subtitulo">Ingresá con tu email y contraseña para acceder a tu cuenta.</p>

            <div id="sesion-error" class="sesion-error"></div>

            <form class="sesion-form" action="../../backend/login.php" method="POST">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required autocomplete="email">

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">

                <button type="submit" class="sesion-enviar">Ingresar</button>
            </form>

            <p class="sesion-cambio">¿Todavía no tenés una cuenta? <a href="registro.html">Registrate acá</a></p>
        </div>
    </main>
    <script>
        // Si el backend redirige con un mensaje de error, lo mostramos acá.
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        if (error) {
            const box = document.getElementById('sesion-error');
            box.textContent = error;
            box.classList.add('visible');
        }
    </script>
    <script src="../javascript/Script.js"></script>
</body>
</html>
